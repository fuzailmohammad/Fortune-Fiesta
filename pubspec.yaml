name: fortune_fiesta
description: A Flutter game.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  
  # GetX
  get: ^4.7.3
  get_storage: ^2.1.1
  path_provider: ^2.1.6

  # Network
  dio: ^5.10.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^8.1.0
  audioplayers: ^6.1.0

  # Firebase
  firebase_core: ^3.7.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.2.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/symbols/
    - assets/images/backup/
    - assets/audio/
    
  fonts:
    - family: lobster
      fonts:
        - asset: assets/fonts/lobster-Regular.ttf
